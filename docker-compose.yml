version: "3.9"

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:15-alpine
    container_name: recruitflow-db
    environment:
      POSTGRES_USER: recruitflow
      POSTGRES_PASSWORD: recruitflow_dev
      POSTGRES_DB: recruitflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: recruitflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- FastAPI Backend ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitflow-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitflow:recruitflow_dev@postgres:5432/recruitflow
      DATABASE_URL_SYNC: postgresql://recruitflow:recruitflow_dev@postgres:5432/recruitflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------- Background Worker ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitflow-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recruitflow:recruitflow_dev@postgres:5432/recruitflow
      DATABASE_URL_SYNC: postgresql://recruitflow:recruitflow_dev@postgres:5432/recruitflow
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      rq worker --with-scheduler --url redis://redis:6379/0

  # ---------- React Frontend ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitflow-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redisdata:
  uploads:
